<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Escalera de madurez de la oficina: las 7 capas de ADR-004</title>
<desc id="d">Siete escalones, uno por capa de la migración isométrica de ADR-004, con el ciclo, la versión y el commit de integración en que se completó cada uno. Después, ideas de prioridad alta y pulido.</desc>
<rect width="1500" height="720" fill="#FFFFFF"/>
<text x="60" y="44" font-size="22" font-weight="700" fill="#1E0C21" text-anchor="start" >Modelo de madurez · La oficina sube por las 7 capas de ADR-004</text>
<text x="60" y="70" font-size="13" font-weight="400" fill="#6B5E6E" text-anchor="start" >Un escalón por capa, en el orden de oficina-relevo:decisiones/ADR-004-isometrico-por-capas.md. Cada escalón: ciclo, versión y commit con que se completó.</text>
<text x="60" y="90" font-size="13" font-weight="400" fill="#6B5E6E" text-anchor="start" >Las capas 1 a 4 entraron en cuatro ciclos seguidos; la 5 y la 6 tomaron dos ciclos cada una. CICLO-005 (v5): repetición de la corrida real, fuera de la escalera (bitácora).</text>
