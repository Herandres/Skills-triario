document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ell);margin:0 auto;padding:0 var(--gut);height:54px;display:flex;align-items:center;justify-content:space-between;gap:20px;}\n.run-mark{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:-0.05em;color:#fff;text-decoration:none;}\n.run-nav{display:flex;gap:4px;}\n.run-nav a{font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--gray-2);text-decoration:none;padding:7px 12px;border-radius:5px;transition:color .2s,background .2s;display:flex;align-items:center;gap:7px;}\n.run-nav a:hover{color:#fff;background:rgba(255,255,255,0.06);}\n.run-nav a .n{font-family:var(--mono);color:var(--red);font-weight:700;}\n\n/* ============ COVER ============ */\n.cover{background:var(--dark);color:#fff;padding:56px 0 0;position:relative;overflow:hidden;}\n.cover-top{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;}\n.cover-top .eyebrow{color:var(--red);}\n.cover-top .right{font-size:11.5px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;color:var(--gray-2);text-align:right;}\n.cover-rule{height:3px;background:var(--red);margin:22px 0 0;}\n.hero{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,26vw,330px);gap:clamp(28px,5vw,72px);align-items:stretch;margin-top:clamp(34px,5vw,60px);}\n.hero-title{font-size:clamp(56px,10vw,150px);line-height:0.84;color:#fff;letter-spacing:-0.045em;font-weight:900;}\n.hero-title .r{color:var(--red);}\n.hero-sub{margin-top:30px;max-width:520px;font-size:clamp(16px,1.7vw,19px);color:var(--gray-2);font-weight:500;line-height:1.5;}\n.hero-tags{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}\n.tag{font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;padding:8px 14px;border:1px solid rgba(255,255,255,0.2);border-radius:30px;color:rgba(255,255,255,0.85);}\n.tag.solid{background:var(--red);border-color:var(--red);color:#fff;}\n/* red seed block */\n.seed-block{position:relative;background:var( border);display:grid;grid-template-columns:clamp(64px,7vw,88px) minmax(0,1fr);gap:24px;align-items:start;}\n.rule-item:nth-child(odd){border-right:1px solid var(--border);padding-right:48px;}\n.rule-item:nth-child(even){padding-left:48px;}\n.rule-n{font-family:var(--display);font-weight:900;font-size:clamp(44px,5vw,62px);line-height:0.72;color:transparent;-webkit-text-stroke:2px var(--red);}\n.rule-item h3{font-size:clamp(19px,2.1vw,23px);letter-spacing:-0.02em;}\n.rule-item p{font-size:15px;color:var(--gray);margin-top:11px;line-height:1.55;}\n.rule-item p .hl{color:var(--ink);font-weight:700;box-shadow:inset 0 -0.55em 0 rgba(239,34,34,0.16);}\n\n/* ============ COMANDOS ============ */\n.refcard{margin-top:52px;border:1px solid var(--border);border-radius:18px;background:#fff;overflow:hidden;}\n.cmd-group{padding:30px 40px;border-bottom:1px solid var(--border);}\n.cmd-group:last-child{border-bottom:none;}\n.cmd-gh{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:3px solid var(--dark);margin-bottom:6px;}\n.cmd-gh .rn{font-family:var(--display);font-weight:900;font-size:20px;color:var(--red);}\n.cmd-gh .gt{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:0.0;text-transform:uppercase;}\n.cmd-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;}\n.cmd{padding:17px 0;border-bottom:1px solid var(--border);}\n.cmd-name{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--dark);display:inline-block;background:var(--neutral);border:1px solid var(--border);border-radius:7px;padding:5px 11px;}\n.cmd-name.hot{color:var(--red);border-color:rgba(239,34,34,0.45);background:rgba(239,34,34,0.05);}\n.cmd-desc{font-size:14px;color:var(--gray);margin-top:10px;line-height:1.5;}\n.cmd-desc em{color:var(--ink);font-weight:600;font-style:normal;}\n.keycap{display:inline-flex;align-items:center;gap:6px;}\n.kc{display:inline-block;background:#fff;border:1px solid var(--border);border-bottom-width:3px;border-radius:7px;padding:5px 11px;font-family:var(--mono);font-weight:700;font-size:14px;color:var(--dark);}\n.cmd.feat .kc{border-color:var(--red);color:var(--red);}\n.cmd.feat .cmd-desc{color:var(--ink);}\n.cmd-flag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:20px;padding:3px 9px;margin-left:9px;vertical-align:middle;}\n\n/* ============ CASO (bulletproof, full-width flow) ============ */\n.caso .opener h2{color:#fff;}\n.caso h2 .r{color:var(--red);}\n.caso-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,5vw,56px);margin-top:8px;}\n.nblock h4{font-size:11.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--red);font-family:var(--body);font-weight:800;margin-bottom:11px;}\n.nblock p{font-size:16.5px;color:var(--gray-2);line-height:1.62;}\n.caso-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:50px;}\n.ccard{border:1px solid rgba(255,255,255,0.16);border-radius:16px;padding:26px 24px;background:rgba(255,255,255,0.025);}\n.ccard .cn{display:flex;align-items:center;gap:10px;margin-bottom:14px;}\n.ccard .cdot{width:11px;height:11px;border-radius:50%;background:var(--red);}\n.ccard .cl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray-2);}\n.ccard p{font-size:16px;line-height:1.45;color:#fff;}\n.ccard p b{color:var(--red);font-weight:800;}\n.caso-cards-title{margin-top:64px;font-size:11.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--red);font-family:var(--body);font-weight:800;}\n\n.report-figure{margin-top:64px;display:grid;grid-template-columns:1fr;justify-items:center;}\n.report{background:#fff;color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 50px 100px -30px rgba(0,0,0,0.7);font-size:12px;max-width:600px;width:100%;}\n.rep-head{background:var(--dark);color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;}\n.rep-logo{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-0.05em;}\n.rep-meta{font-size:10px;text-align:right;opacity:0.55;line-height:1.5;}\n.rep-hero{padding:18px 20px 14px;border-bottom:3px solid var(--red);}\n.rep-spr{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;letter-spacing:-0.03em;}\n.rep-sprsub{font-size:11px;color:var(--gray);margin-top:4px;}\n.rep-pill{display:flex;align-items:center;gap:9px;margin-top:13px;padding:9px 13px;border-radius:5px;font-size:11px;font-weight:600;border-left:4px solid var(--red);background:var(--neutral);}\n.rep-pill .pd{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex-shrink:0;}\n.rep-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);}\n.rep-kpi{background:#fff;padding:14px 6px;text-align:center;}\n.rep-kval{font-family:var(--display);font-weight:900;font-size:23px;line-height:1;}\n.rep-klbl{font-size:7.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray);margin-top:5px;}\n.k-green{color:var(--green);}.k-red{color:var(--red);}.k-yellow{color:var(--yellow);}.k-dark{color:var(--dark);}\n.rep-sec{padding:16px 20px;}\n.rep-seclbl{font-size:8px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--gray);margin-bottom:12px;}\n.rep-pat{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:start;}\n.rep-pat:last-child{border-bottom:none;}\n.rep-patn{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:12px;}\n.rep-patt{font-weight:700;font-size:12px;line-height:1.3;}\n.rep-patd{font-size:11px;color:var(--gray);margin-top:2px;line-height:1.35;}\n.fcaption{font-family:var(--mono);font-size:11px;color:var(--gray-2);margin-top:16px;letter-spacing:0.03em;text-align:center;}\n.fcaption b{color:rgba(255,255,255,0.75);font-weight:700;}\n\n.caso-pq{margin:72px 0 0;padding:56px 0;border-top:3px solid var(--red);border-bottom:1px solid rgba(255,255,255,0.16);}\n.caso-pq p{font-family:var(--display);font-weight:900;font-size:clamp(28px,4.4vw,56px);line-height:1.04;letter-spacing:-0.03em;color:#fff;max-width:1000px;}\n.caso-pq .r{color:var(--red);}\n.cta-final{margin-top:40px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}\n.cta-final p{font-size:19px;color:var(--gray-2);}\n.cta-final b{color:#fff;font-weight:700;}\n.cta-final .big{font-family:var(--display);font-weight:900;font-size:clamp(30px,4vw,52px);color:#fff;letter-spacing:-0.03em;line-height:0.95;}\n.cta-final .big .r{color:var(--red);}\n\n/* ============ COLOPHON ============ */\n.colophon{background:var(--dark);color:var(--gray-2);border-top:1px solid rgba(255,255,255,0.1);padding:46px 0;}\n.colo-grid{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}\n.colo-mark{font-family:var(--display);font-weight:900;font-size:36px;letter-spacing:-0.05em;color:#fff;line-height:0.9;}\n.colo-tag{font-size:13px;color:rgba(255,255,255,0.72);font-weight:600;margin-top:8px;}\n.colo-meta{font-family:var(--mono);font-size:11px;letter-spacing:0.03em;color:var(--gray-2);text-align:right;line-height:1.9;}\n\n/* ============ RESPONSIVE ============ */\n@media(max-width:1040px){\n  .caso-cards{grid-template-columns:1fr;}\n}\n@media(max-width:860px){\n  :root{--gut:22px;}\n  .run-nav{display:none;}\n  .hero{grid-template-columns:1fr;}\n  .seed-block{min-height:200px;flex-direction:row;gap:14px;}\n  .seed-stack{flex-direction:row;gap:6px;}\n  .acro-row{grid-template-columns:64px 1fr;gap:16px;}\n  .step{grid-template-columns:1fr;gap:6px;}\n  .pipe-row{grid-template-columns:1fr;gap:10px;}\n  .pipe-arrow,.pipe-conn{display:none;}\n  .pipeline{padding:8px 20px;}\n  .ledger{grid-template-columns:1fr;}\n  .rule-item:nth-child(odd){border-right:none;padding-right:0;}\n  .rule-item:nth-child(even){padding-left:0;}\n  .cmd-list{grid-template-columns:1fr;}\n  .cmd-group{padding:24px;}\n  .entry{grid-template-columns:1fr;gap:14px;}\n  .entry-rail{flex-direction:row;align-items:center;gap:16px;}\n  .caso-cols{grid-template-columns:1fr;}\n  .feature{padding:64px 0;}\n  .colo-grid{flex-direction:column;align-items:flex-start;}\n  .colo-meta{text-align:left;}\n}\n\n/* ============ PRINT ============ */\n@media print{\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  @page{size:A4;margin:13mm;}\n  .runbar{display:none;}\n  .shell{max-width:none;padding:0;}\n  .cover,.manifesto,.feature,.colophon{padding:0;page-break-after:always;break-after:page;}\n  .entry-prompt{max-height:none!important;margin-top:14px!important;}\n  .entry-toggle,.copy-btn{display:none;}\n  .entry,.rule-item,.step,.ccard{break-inside:avoid;}\n  .hero-title{font-size:84px;}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ===== RUNNING HEAD ===== -->\n<header class=\"runbar\">\n  <div class=\"runbar-inner\">\n    <a href=\"#cover\" class=\"run-mark\">triario<\u002Fa>\n    <nav class=\"run-nav\">\n      <a href=\"#framework\"><span class=\"n\">01<\u002Fspan>Framework<\u002Fa>\n      <a href=\"#prompts\"><span class=\"n\">02<\u002Fspan>Prompts<\u002Fa>\n      <a href=\"#reglas\"><span class=\"n\">03<\u002Fspan>Reglas<\u002Fa>\n      <a href=\"#comandos\"><span class=\"n\">04<\u002Fspan>Comandos<\u002Fa>\n      <a href=\"#caso\"><span class=\"n\">05<\u002Fspan>Caso<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===== COVER ===== -->\n<section class=\"cover\" id=\"cover\" data-screen-label=\"Portada\">\n  <div class=\"shell\">\n    <div class=\"cover-top\">\n      <div class=\"kick eyebrow\">Kit de Construcción de Agentes<\u002Fdiv>\n      <div class=\"right\">Framework universal<br>para agentes de IA<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cover-rule\"><\u002Fdiv>\n\n    <div class=\"hero\">\n      <div>\n        <h1 class=\"hero-title\">CONSTRUYE<br>AGENTES<br>QUE<br>FUNCIONAN<span class=\"r\">.<\u002Fspan><\u002Fh1>\n        <p class=\"hero-sub\">Un método de medio día para pasar de “no sé qué hay aquí” a un agente que funciona desde el primer intento.<\u002Fp>\n        <div class=\"hero-tags\">\n          <span class=\"tag solid\">ARQ<\u002Fspan><span class=\"tag solid\">DIS<\u002Fspan><span class=\"tag solid\">WRT<\u002Fspan><span class=\"tag solid\">TST<\u002Fspan>\n          <span class=\"tag\">8 prompts<\u002Fspan><span class=\"tag\">5 pasos<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"seed-block\">\n        <div class=\"lab\">7 principios<\u002Fdiv>\n        <div class=\"seed-stack\"><span>T<\u002Fspan><span>R<\u002Fspan><span>I<\u002Fspan><span>A<\u002Fspan><span>R<\u002Fspan><span>I<\u002Fspan><span>O<\u002Fspan><\u002Fdiv>\n        <div class=\"foot\">para construir bien<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"manifesto\">\n    <div class=\"shell\">\n      <div class=\"mf-head\">\n        <div><span class=\"kick\">El manifiesto<\u002Fspan><h2 style=\"margin-top:10px;\">Siete principios<\u002Fh2><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"acro\">\n        <div class=\"acro-row\"><div class=\"acro-l\">T<\u002Fdiv><div class=\"acro-t\"><b>Traza<\u002Fb> la arquitectura antes de escribir<\u002Fdiv><\u002Fdiv>\n        <div class=\"acro-row\"><div class=\"acro-l\">R<\u002Fdiv><div class=\"acro-t\"><b>Registra<\u002Fb> cada campo con tipo y ejemplo real<\u002Fdiv><\u002Fdiv>\n        <div class=\"acro-row\"><div class=\"acro-l\">I<\u002Fdiv><div class=\"acro-t\"><b>Identifica<\u002Fb> el objetivo en una sola frase<\u002Fdiv><\u002Fdiv>\n        <div class=\"acro-row\"><div class=\"acro-l\">A<\u002Fdiv><div class=\"acro-t\"><b>Anticipa<\u002Fb> los casos borde antes del deploy<\u002Fdiv><\u002Fdiv>\n        <div class=\"acro-row\"><div class=\"acro-l\">R<\u002Fdiv><div class=\"acro-t\"><b>Reglas<\u002Fb> anti-alucinación en cada prompt<\u002Fdiv><\u002Fdiv>\n        <div class=\"acro-row\"><div class=\"acro-l\">I<\u002Fdiv><div class=\"acro-t\"><b>Integra<\u002Fb> los 4 componentes en orden<\u002Fdiv><\u002Fdiv>\n        <div class=\"acro-row\"><div class=\"acro-l\">O<\u002Fdiv><div class=\"acro-t\"><b>Optimiza<\u002Fb> guiado por fallos reales<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== 01 · FRAMEWORK ===== -->\n<section class=\"feature paper\" id=\"framework\" data-screen-label=\"Framework 5 pasos\">\n  <div class=\"shell\">\n    <div class=\"topline\"><\u002Fdiv>\n    <div class=\"opener\">\n      <div class=\"opener-meta\"><span class=\"fol\">01<\u002Fspan><span class=\"kick\">El método<\u002Fspan><\u002Fdiv>\n      <h2>El framework<br>en 5 pasos<\u002Fh2>\n      <p class=\"standfirst\">Antes de escribir una sola línea del prompt.<\u002Fp>\n    <\u002Fdiv>\n\n    <p class=\"lede dropcap\">El 60% del trabajo de un agente no está en el prompt. Está en entender la arquitectura de los datos antes de escribir. Este kit convierte ese 60% en un proceso de medio día.<\u002Fp>\n\n    <div class=\"steps\">\n      <div class=\"step\"><div class=\"step-num\">1<\u002Fdiv><div><div class=\"step-of\">Paso 01<\u002Fdiv><h3>Arquitectura<\u002Fh3><p class=\"step-q\">¿Dónde viven los datos?<\u002Fp><p class=\"step-d\">Mapear la fuente antes de cualquier otra cosa. Sin esto, el agente consulta en el lugar equivocado.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-num\">2<\u002Fdiv><div><div class=\"step-of\">Paso 02<\u002Fdiv><h3>Protocolo<\u002Fh3><p class=\"step-q\">¿Cómo se accede a esos datos?<\u002Fp><p class=\"step-d\">Orden de consulta, límites de paginación, autenticación.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-num\">3<\u002Fdiv><div><div class=\"step-of\">Paso 03<\u002Fdiv><h3>Diccionario<\u002Fh3><p class=\"step-q\">¿Qué significa cada dato en el contexto del negocio?<\u002Fp><p class=\"step-d\">Las reglas que convierten datos crudos en información útil.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-num\">4<\u002Fdiv><div><div class=\"step-of\">Paso 04<\u002Fdiv><h3>Output<\u002Fh3><p class=\"step-q\">¿Qué produce el agente exactamente?<\u002Fp><p class=\"step-d\">Formato, estructura y nivel de detalle del resultado esperado.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-num\">5<\u002Fdiv><div><div class=\"step-of\">Paso 05<\u002Fdiv><h3>Criterio de parada<\u002Fh3><p class=\"step-q\">¿Cuándo está bien hecho?<\u002Fp><p class=\"step-d\">Sin esto el agente no sabe cuándo terminar.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"statement\">\n      <span class=\"qm\">“<\u002Fspan>\n      <p>Nunca escribas el prompt antes de tener los 5 pasos respondidos.<\u002Fp>\n      <div class=\"attr\">Regla cero del kit<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"figure\">\n      <div class=\"fig-head\"><span class=\"fno\">Fig. 1<\u002Fspan><span class=\"fcap\">Cadena de dependencias — cada documento alimenta al siguiente.<\u002Fspan><\u002Fdiv>\n      <div class=\"pipeline\" id=\"pipeline\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== 02 · CATÁLOGO ===== -->\n<section class=\"feature\" id=\"prompts\" data-screen-label=\"Los 8 prompts\">\n  <div class=\"shell\">\n    <div class=\"topline\"><\u002Fdiv>\n    <div class=\"opener\">\n      <div class=\"opener-meta\"><span class=\"fol\">02<\u002Fspan><span class=\"kick\">El catálogo<\u002Fspan><\u002Fdiv>\n      <h2>Los 8 prompts<\u002Fh2>\n      <p class=\"standfirst\">Cada uno produce un documento. Cada documento alimenta al siguiente. <b style=\"color:var(--ink)\">ARQ-01<\u002Fb> y <b style=\"color:var(--ink)\">ARQ-02<\u002Fb> son alternativas — no secuencia.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"cat-legend\" id=\"catLegend\"><\u002Fdiv>\n    <div id=\"chapters\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== 03 · REGLAS ===== -->\n<section class=\"feature paper\" id=\"reglas\" data-screen-label=\"10 Reglas de Oro\">\n  <div class=\"shell\">\n    <div class=\"topline\"><\u002Fdiv>\n    <div class=\"opener\">\n      <div class=\"opener-meta\"><span class=\"fol\">03<\u002Fspan><span class=\"kick\">El presupuesto · Claude.ai<\u002Fspan><\u002Fdiv>\n      <h2>Las 10<br>reglas de oro<\u002Fh2>\n      <p class=\"standfirst\">Para trabajar con Claude.ai sin desperdiciar el presupuesto. El mismo resultado puede costar el doble según cómo estructures la conversación.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ledger\">\n      <div class=\"rule-item\"><div class=\"rule-n\">01<\u002Fdiv><div><h3>Una tarea, una conversación<\u002Fh3><p>Cada hilo nuevo arranca con contexto cero. <span class=\"hl\">Mezclar temas en un mismo hilo es mezclar facturas.<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">02<\u002Fdiv><div><h3>El Project Instructions es tu mejor inversión<\u002Fh3><p>Lo que defines ahí no se cobra en cada mensaje. <span class=\"hl\">Escríbelo bien una vez — ahorra siempre.<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">03<\u002Fdiv><div><h3>El primer mensaje es el más importante<\u002Fh3><p>Todo el contexto, el formato esperado y el scope en un solo disparo. <span class=\"hl\">Cada vuelta de aclaración cuesta.<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">04<\u002Fdiv><div><h3>Sé el director, no el improvisador<\u002Fh3><p>“Quiero una tabla con estas 3 columnas” es <span class=\"hl\">10× más barato<\u002Fspan> que descubrir el formato después de ver el resultado.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">05<\u002Fdiv><div><h3>El Knowledge del Project trabaja gratis<\u002Fh3><p>Archivos en Knowledge = referencia sin costo. <span class=\"hl\">Archivos pegados en el chat = tokens cobrados cada vez.<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">06<\u002Fdiv><div><h3>No pidas permiso para continuar<\u002Fh3><p>“¿Entendiste?” y “¿Estás seguro?” son <span class=\"hl\">tokens que no informan ni deciden nada.<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">07<\u002Fdiv><div><h3>Las preguntas de seguimiento van en el mismo hilo<\u002Fh3><p>El reporte ya calculado no se recalcula. <span class=\"hl\">El hilo tiene memoria — úsala antes de abrir uno nuevo.<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">08<\u002Fdiv><div><h3>Pide el cambio exacto, no la reescritura<\u002Fh3><p>“Cambia el párrafo 3” cuesta <span class=\"hl\">el 10%<\u002Fspan> de “reescribe el documento completo”.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">09<\u002Fdiv><div><h3>Interrumpe cuando tienes lo que necesitas<\u002Fh3><p>No esperes que Claude termine si ya leíste lo que buscabas. <span class=\"hl\">Cada línea adicional tiene precio.<\u002Fspan><\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"rule-item\"><div class=\"rule-n\">10<\u002Fdiv><div><h3>El scope es el presupuesto<\u002Fh3><p>“Solo el equipo Tech” cuesta lo que pesa. <span class=\"hl\">“Los 5 equipos” cuesta 5 veces más.<\u002Fspan> Define el alcance antes de enviar.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== 04 · COMANDOS ===== -->\n<section class=\"feature\" id=\"comandos\" data-screen-label=\"Comandos Claude Code\">\n  <div class=\"shell\">\n    <div class=\"topline\"><\u002Fdiv>\n    <div class=\"opener\">\n      <div class=\"opener-meta\"><span class=\"fol\">04<\u002Fspan><span class=\"kick\">Referencia · Claude Code<\u002Fspan><\u002Fdiv>\n      <h2>Comandos<br>Claude Code<\u002Fh2>\n      <p class=\"standfirst\">Los más importantes. Los que más tiempo y tokens ahorran.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"refcard\" id=\"refcard\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== 05 · CASO ===== -->\n<section class=\"feature dark caso\" id=\"caso\" data-screen-label=\"Caso real Sprint Intelligence\">\n  <div class=\"shell\">\n    <div class=\"topline\"><\u002Fdiv>\n    <div class=\"opener\" style=\"max-width:980px;\">\n      <div class=\"opener-meta\"><span class=\"fol\">05<\u002Fspan><span class=\"kick\">Caso de estudio · Sprint Intelligence System<\u002Fspan><\u002Fdiv>\n      <h2>1 mes construyéndolo.<br><span class=\"r\">3–5 días<\u002Fspan> con el kit.<\u002Fh2>\n      <p class=\"standfirst\">El caso que generó el framework.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"caso-cols\">\n      <div class=\"nblock\"><h4>El problema<\u002Fh4><p>El equipo no sabía dónde vivían los datos en ClickUp. No había documentación. Cada consulta era un experimento. El 60% del tiempo total se fue en descubrir la arquitectura a prueba y error — antes de escribir una sola línea del prompt.<\u002Fp><\u002Fdiv>\n      <div class=\"nblock\"><h4>Lo que construyeron<\u002Fh4><p>5 equipos. 843 tareas. 6 patrones de jerarquía. 12 clientes simultáneos. Un solo reporte generado en tiempo real desde ClickUp.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"caso-cards-title\">Lo que hace que una hoja de cálculo no puede<\u002Fdiv>\n    <div class=\"caso-cards\">\n      <div class=\"ccard\"><div class=\"cn\"><span class=\"cdot\"><\u002Fspan><span class=\"cl\">Detecta<\u002Fspan><\u002Fdiv><p>Que <b>“en pausa” ≠ VENCIDA<\u002Fb> aunque la fecha ya pasó.<\u002Fp><\u002Fdiv>\n      <div class=\"ccard\"><div class=\"cn\"><span class=\"cdot\"><\u002Fspan><span class=\"cl\">Normaliza<\u002Fspan><\u002Fdiv><p><b>5 vocabularios distintos<\u002Fb> de estado en una sola métrica consistente.<\u002Fp><\u002Fdiv>\n      <div class=\"ccard\"><div class=\"cn\"><span class=\"cdot\"><\u002Fspan><span class=\"cl\">Identifica<\u002Fspan><\u002Fdiv><p>Que <b>10+ vencidas × 3 proyectos<\u002Fb> en una persona = escalada hoy.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"report-figure\">\n      <div class=\"report\">\n        <div class=\"rep-head\"><div class=\"rep-logo\">triario<\u002Fdiv><div class=\"rep-meta\">Sprint Intelligence Report<br>ClickUp · Tiempo real<\u002Fdiv><\u002Fdiv>\n        <div class=\"rep-hero\">\n          <div class=\"rep-spr\">Sprint 122<\u002Fdiv>\n          <div class=\"rep-sprsub\">UNA Tech · Global LATAM<\u002Fdiv>\n          <div class=\"rep-pill\"><span class=\"pd\"><\u002Fspan> 50% con ritmo bajo — Carlos Avilez concentra 10+ vencidas; escalada hoy.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"rep-kpis\">\n          <div class=\"rep-kpi\"><div class=\"rep-kval k-dark\">~200<\u002Fdiv><div class=\"rep-klbl\">Total tareas<\u002Fdiv><\u002Fdiv>\n          <div class=\"rep-kpi\"><div class=\"rep-kval k-green\">50%<\u002Fdiv><div class=\"rep-klbl\">Completado<\u002Fdiv><\u002Fdiv>\n          <div class=\"rep-kpi\"><div class=\"rep-kval k-yellow\">25<\u002Fdiv><div class=\"rep-klbl\">En progreso<\u002Fdiv><\u002Fdiv>\n          <div class=\"rep-kpi\"><div class=\"rep-kval k-red\">~50<\u002Fdiv><div class=\"rep-klbl\">Vencidas<\u002Fdiv><\u002Fdiv>\n          <div class=\"rep-kpi\"><div class=\"rep-kval k-dark\">3<\u002Fdiv><div class=\"rep-klbl\">Días sprint<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"rep-sec\">\n          <div class=\"rep-seclbl\">Análisis de causa — Vencidas<\u002Fdiv>\n          <div class=\"rep-pat\"><div class=\"rep-patn\">1<\u002Fdiv><div><div class=\"rep-patt\">“En pausa” contadas como vencidas<\u002Fdiv><div class=\"rep-patd\">La fecha pasó pero el estado bloquea el avance — no es deuda real del equipo.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"rep-pat\"><div class=\"rep-patn\">2<\u002Fdiv><div><div class=\"rep-patt\">5 vocabularios de estado sin normalizar<\u002Fdiv><div class=\"rep-patd\">Cada cliente nombra distinto lo mismo. Una métrica consistente lo unifica.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"rep-pat\"><div class=\"rep-patn\">3<\u002Fdiv><div><div class=\"rep-patt\">Concentración crítica en una persona<\u002Fdiv><div class=\"rep-patd\">10+ vencidas × 3 proyectos simultáneos = riesgo de bloqueo en cierre de sprint.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fcaption\"><b>Fig. 2<\u002Fb> — Reporte Sprint 122 · Generado en tiempo real desde ClickUp.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"caso-pq\"><p><span class=\"r\">“<\u002Fspan>El 60% del trabajo de un agente no está en el prompt. Está en entender los datos antes de escribir.<span class=\"r\">”<\u002Fspan><\u002Fp><\u002Fdiv>\n    <div class=\"cta-final\">\n      <div class=\"big\">Constrúyelo en <span class=\"r\">3–5 días.<\u002Fspan><\u002Fdiv>\n      <p>Hoy opera en producción para 5 equipos.<br><b>El tuyo empieza con el primer prompt.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== COLOPHON ===== -->\n<footer class=\"colophon\">\n  <div class=\"shell\">\n    <div class=\"colo-grid\">\n      <div>\n        <div class=\"colo-mark\">triario<\u002Fdiv>\n        <div class=\"colo-tag\">The smartest way to grow · www.triario.co<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"colo-meta\">Kit de Construcción de Agentes<br>Framework universal para agentes de IA<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script src=\"24464186-0052-425d-9d6f-278f2a1071b8\"><\u002Fscript>\n<script>\n(function(){\n  var CHAP={\n    ARQ:{rn:'I',  name:'Arquitectura', color:'#EF2222'},\n    DIS:{rn:'II', name:'Diseño',       color:'#2563eb'},\n    WRT:{rn:'III',name:'Escritura',    color:'#16a34a'},\n    TST:{rn:'IV', name:'Pruebas',      color:'#d97706'}\n  };\n  var prompts=window.KIT_PROMPTS||[];\n\n  var leg=document.getElementById('catLegend');\n  Object.keys(CHAP).forEach(function(g){\n    var c=CHAP[g], n=prompts.filter(function(p){return p.grupo===g;}).length;\n    var a=document.createElement('a');a.className='leg';a.href='#chap-'+g;\n    a.innerHTML='<span class=\"d\" style=\"background:'+c.color+'\"><\u002Fspan>'+g+' · '+c.name+' <span class=\"lc\">'+n+'<\u002Fspan>';\n    leg.appendChild(a);\n  });\n\n  var chapWrap=document.getElementById('chapters');\n  var globalN=0;\n  Object.keys(CHAP).forEach(function(g){\n    var c=CHAP[g];\n    var items=prompts.filter(function(p){return p.grupo===g;});\n    var sec=document.createElement('div');sec.className='chapter';sec.id='chap-'+g;\n    sec.innerHTML='<div class=\"chapter-head\">'+\n      '<div class=\"chapter-rn\">'+c.rn+'<\u002Fdiv>'+\n      '<div class=\"chapter-name\"><span class=\"d\" style=\"background:'+c.color+'\"><\u002Fspan>'+g+' · '+c.name+'<\u002Fdiv>'+\n      '<div class=\"chapter-meta\">'+items.length+(items.length>1?' prompts':' prompt')+'<\u002Fdiv><\u002Fdiv>'+\n      '<div class=\"entries\"><\u002Fdiv>';\n    var entriesEl=sec.querySelector('.entries');\n    items.forEach(function(p){\n      globalN++;\n      var num=String(globalN).padStart(2,'0');\n      var altBadge=p.alt?'<span class=\"entry-alt\">Alternativa<\u002Fspan>':'';\n      var art=document.createElement('article');art.className='entry';art.setAttribute('data-grupo',g);\n      art.innerHTML=\n        '<div class=\"entry-rail\"><div class=\"entry-num\">'+num+'<\u002Fdiv>'+\n          '<div class=\"entry-id\"><span class=\"d\" style=\"background:'+p.color+'\"><\u002Fspan>'+p.id+'<\u002Fdiv>'+altBadge+'<\u002Fdiv>'+\n        '<div class=\"entry-body\">'+\n          '<h3 class=\"entry-name\">'+p.nombre+'<\u002Fh3>'+\n          '<div class=\"entry-grid\">'+\n            '<div><span class=\"lbl\">Cuándo usarlo<\u002Fspan><span class=\"v\">'+p.cuando+'<\u002Fspan><\u002Fdiv>'+\n            '<div><span class=\"lbl\">Produce<\u002Fspan><span class=\"v\"><code>'+p.produce+'<\u002Fcode><\u002Fspan><\u002Fdiv><\u002Fdiv>'+\n          '<p class=\"entry-desc\">'+p.descripcion+'<\u002Fp>'+\n          '<button class=\"entry-toggle\"><span class=\"pm\">+<\u002Fspan> Ver prompt completo<\u002Fbutton>'+\n          '<div class=\"entry-prompt\"><div class=\"code-block\">'+\n            '<span class=\"code-label\">'+p.id+' · '+p.produce+'<\u002Fspan>'+\n            '<button class=\"copy-btn\">Copiar prompt<\u002Fbutton><pre><\u002Fpre><\u002Fdiv><\u002Fdiv>'+\n        '<\u002Fdiv>';\n      art.querySelector('pre').textContent=p.prompt;\n      var box=art.querySelector('.entry-prompt');\n      var toggle=art.querySelector('.entry-toggle');\n      toggle.addEventListener('click',function(){\n        var open=art.classList.toggle('open');\n        if(open){box.style.maxHeight=box.scrollHeight+'px';toggle.innerHTML='<span class=\"pm\">−<\u002Fspan> Cerrar prompt';}\n        else{box.style.maxHeight='0px';toggle.innerHTML='<span class=\"pm\">+<\u002Fspan> Ver prompt completo';}\n      });\n      var copy=art.querySelector('.copy-btn');\n      copy.addEventListener('click',function(){\n        var done=function(){copy.textContent='✓ Copiado';copy.classList.add('done');setTimeout(function(){copy.textContent='Copiar prompt';copy.classList.remove('done');},2000);};\n        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p.prompt).then(done,function(){fb(p.prompt);done();});}\n        else{fb(p.prompt);done();}\n      });\n      entriesEl.appendChild(art);\n    });\n    chapWrap.appendChild(sec);\n  });\n  function fb(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}\n  window.addEventListener('resize',function(){document.querySelectorAll('.entry.open .entry-prompt').forEach(function(b){b.style.maxHeight=b.scrollHeight+'px';});});\n\n  var pipe=[\n    {chips:[{id:'ARQ-01',c:'#EF2222'},{id:'ARQ-02',c:'#EF2222'}],art:'ARCHITECTURE_MAP.md'},\n    {chips:[{id:'DIS-01',c:'#2563eb'}],art:'AGENT_SPEC.md'},\n    {chips:[{id:'DIS-02',c:'#2563eb'}],art:'DATA_DICTIONARY.md'},\n    {chips:[{id:'DIS-03',c:'#2563eb'}],art:'ANTI_HALLUCINATION_RULES.md'},\n    {chips:[{id:'WRT-01',c:'#16a34a'}],art:'PROMPT_SKELETON.md'},\n    {chips:[{id:'WRT-02',c:'#16a34a'}],art:'PROMPT_SKELETON <span class=\"as\">v1.1<\u002Fspan>'},\n    {chips:[{id:'TST-01',c:'#d97706'}],art:'PROMPT_SKELETON <span class=\"as\">vN<\u002Fspan>'}\n  ];\n  var pl=document.getElementById('pipeline');\n  pipe.forEach(function(d){\n    var row=document.createElement('div');row.className='pipe-row';\n    var chips='<div class=\"pipe-chips\">';\n    d.chips.forEach(function(ch,i){\n      if(i>0)chips+='<span class=\"pipe-or\">o<\u002Fspan>';\n      chips+='<span class=\"pchip\"><span class=\"d\" style=\"background:'+ch.c+'\"><\u002Fspan>'+ch.id+'<\u002Fspan>';\n    });\n    chips+='<\u002Fdiv>';\n    row.innerHTML='<span class=\"pipe-conn\"><\u002Fspan>'+chips+'<span class=\"pipe-arrow\">→<\u002Fspan><span class=\"pipe-art\">'+d.art+'<\u002Fspan>';\n    pl.appendChild(row);\n  });\n\n  var groups=[\n    {rn:'I',title:'Contexto y costo',items:[\n      {name:'/clear',desc:'Borra el contexto completamente. Para empezar una tarea nueva sin arrastrar tokens de la anterior.'},\n      {name:'/compact',desc:'Comprime el historial manteniendo lo esencial. Acepta instrucciones: <em>/compact enfócate en los errores del pipeline<\u002Fem>. Úsalo cuando la conversación lleva más de 20 mensajes.'},\n      {name:'/cost',desc:'Muestra el gasto de tokens de la sesión. Revísalo antes de tareas largas para decidir si limpiar primero.'}\n    ]},\n    {rn:'II',title:'Configuración y sesión',items:[\n      {name:'/model',desc:'Cambia el modelo activo. Haiku → búsquedas simples · Sonnet → análisis · Opus → razonamiento complejo. <em>El modelo correcto puede bajar el costo a la mitad.<\u002Fem>'},\n      {name:'/config',desc:'Abre la configuración de Claude Code.'},\n      {name:'/init',desc:'Genera el CLAUDE.md del proyecto. Define el contexto permanente — lo que Claude sabe sin que lo repitas.'},\n      {name:'/memory',desc:'Abre la memoria persistente del usuario. Lo que guardas aquí aplica en todas las sesiones futuras.'},\n      {name:'/doctor',desc:'Verifica que la instalación esté correcta. Primer paso cuando algo no funciona.'},\n      {name:'/login · /logout',desc:'Gestión de sesión y cuenta.'}\n    ]},\n    {rn:'III',title:'Desarrollo',items:[\n      {name:'/review',desc:'Code review sobre el diff activo. Solo lo que cambió, no todo el proyecto.'},\n      {name:'/run',desc:'Corre la aplicación y observa el comportamiento real.'},\n      {name:'/simplify',desc:'Aplica limpiezas de simplificación y eficiencia al código modificado.'},\n      {name:'/security-review',desc:'Auditoría de seguridad del branch activo.'},\n      {name:'/verify',desc:'Confirma que el cambio funciona en el flujo real, no solo en tests.'}\n    ]},\n    {rn:'IV',title:'Atajos y prefijos',items:[\n      {kc:['Esc'],desc:'Cancela la operación en curso.'},\n      {kc:['Esc','Esc'],desc:'Interrumpe a Claude a mitad de respuesta. Corta el gasto de tokens inmediatamente.',flag:'El más útil',feat:true},\n      {name:'#texto',desc:'Guarda en memoria sin abrir /memory.'},\n      {name:'@archivo',desc:'Referencia un archivo sin cargarlo completo en el contexto.'},\n      {name:'/mcp',desc:'Lista y gestiona los servidores MCP conectados al proyecto.'}\n    ]}\n  ];\n  var rc=document.getElementById('refcard');\n  groups.forEach(function(g){\n    var sec=document.createElement('div');sec.className='cmd-group';\n    var head='<div class=\"cmd-gh\"><span class=\"rn\">'+g.rn+'<\u002Fspan><span class=\"gt\">'+g.title+'<\u002Fspan><\u002Fdiv>';\n    var list='<div class=\"cmd-list\">';\n    g.items.forEach(function(it){\n      var nameHtml=it.kc?'<span class=\"keycap\">'+it.kc.map(function(k){return '<span class=\"kc\">'+k+'<\u002Fspan>';}).join('')+'<\u002Fspan>':'<span class=\"cmd-name'+(it.feat?' hot':'')+'\">'+it.name+'<\u002Fspan>';\n      var flag=it.flag?'<span class=\"cmd-flag\">'+it.flag+'<\u002Fspan>':'';\n      list+='<div class=\"cmd'+(it.feat?' feat':'')+'\">'+nameHtml+flag+'<div class=\"cmd-desc\">'+it.desc+'<\u002Fdiv><\u002Fdiv>';\n    });\n    list+='<\u002Fdiv>';\n    sec.innerHTML=head+list;rc.appendChild(sec);\n  });\n})();\n<\u002Fscript>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
